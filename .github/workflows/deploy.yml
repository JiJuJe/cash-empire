name: Deploy Cash Empire to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: CashEmpire
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live game assets
        shell: bash
        run: |
          for attempt in {1..12}; do
            html=$(curl -fsSL "https://jijuje.github.io/cash-empire/?v=$GITHUB_SHA" || true)
            js=$(curl -fsSL "https://jijuje.github.io/cash-empire/script.js?v=$GITHUB_SHA" || true)
            css=$(curl -fsSL "https://jijuje.github.io/cash-empire/style.css?v=$GITHUB_SHA" || true)
            if [[ "$html" == *"collectors-2"* && "$js" == *"collectorVisuals"* && "$css" == *"collector-group"* ]]; then
              echo "Live game assets match the deployed collector layout."
              exit 0
            fi
            sleep 5
          done
          echo "Live game assets did not match the deployment."
          exit 1
