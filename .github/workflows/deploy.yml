name: Deploy ClickTheCash to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test Worker calculations and API guards
        run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: CashEmpire
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live game assets
        shell: bash
        run: |
          for attempt in {1..12}; do
            html=$(curl -fsSL "https://jijuje.github.io/cash-empire/?v=$GITHUB_SHA" || true)
            js=$(curl -fsSL "https://jijuje.github.io/cash-empire/script.js?v=$GITHUB_SHA" || true)
            css=$(curl -fsSL "https://jijuje.github.io/cash-empire/style.css?v=$GITHUB_SHA" || true)
            image_status=$(curl -sL -o /dev/null -w "%{http_code}" "https://jijuje.github.io/cash-empire/assets/cash-collector.png?v=$GITHUB_SHA")
            audio_status=$(curl -sL -o /dev/null -w "%{http_code}" "https://jijuje.github.io/cash-empire/assets/audio/background.wav?v=$GITHUB_SHA")
            golden_status=$(curl -sL -o /dev/null -w "%{http_code}" "https://jijuje.github.io/cash-empire/assets/ui/golden-bill.png?v=$GITHUB_SHA")
            if [[ "$html" == *"ui-assets-1"* && "$js" == *"LEGACY_CLOUD_OUTBOX_PREFIX"* && "$css" == *".booster-slots"* && "$image_status" == "200" && "$audio_status" == "200" && "$golden_status" == "200" ]]; then
              echo "Live game assets match the deployed redesign."
              exit 0
            fi
            sleep 5
          done
          echo "Live game assets did not match the deployment."
          exit 1
